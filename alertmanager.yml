global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'rahmaa.ahmed24@gmail.com'
  smtp_auth_username: 'rahmaa.ahmed24@gmail.com'
  smtp_auth_password: 'rzlvubhwlebgfdfa'
  smtp_require_tls: true


  
# The root route on which each incoming alert enters.
route:
  # The root route must not have any matchers as it is the entry point for
  # all alerts. It needs to have a receiver configured so alerts that do not
  # match any of the sub-routes are sent to someone.
  receiver: 'my-gmail&telegram'

  
  group_wait: 5s

  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 10s

  # If an alert has successfully been sent, wait 'repeat_interval' to
  # resend them.
  repeat_interval: 2h
 


receivers:
- name: 'my-gmail&telegram'
  email_configs:
  - to: 'rahmaa.ahmed24@gmail.com'
    send_resolved: true
  telegram_configs:
  - bot_token: "8523301312:AAGdSCYeTb65CL3giobPcssvhEyd-DJxRMk"
    chat_id: 817077845
    send_resolved: true
    message: "High Disk Usage ༎ຶ⁠‿⁠༎ຶ"

