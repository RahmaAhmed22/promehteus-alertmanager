groups:
- name: example
  labels:
    team: myteam
  rules:
  - alert: Disk Usage
    expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_avail_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"}  > 0.8
    for: 10s
    keep_firing_for: 5m
    labels:
      severity: page
    annotations:
      summary: High Disk Usage *\O/*
